[package]
name = "vortex-contracts"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vortex_contracts"
path="src/lib.rs"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = ["devnet"]
devnet=[]

[dependencies]
anchor-lang = "0.30.1"
solana-program = "1.16"
anchor-spl = "0.30.1"
pyth-client = "0.2.2"
bytemuck = { version = "1.4.0" }
borsh = "0.10.3"
num-traits = "0.2"
uint = { version = "0.9.1", default-features = false }
num-derive = "0.3"
thiserror = "1.0"
num-integer = "0.1.44"
arrayref = "0.3.6"
base64 = "0.13.0"
enumflags2 = "0.6.4"
pyth-solana-receiver-sdk = "0.2.0"
solana-security-txt = "1.1.0"
static_assertions = "1.1.0"
byteorder = "1.4.3"
serum_dex = { git = "https://github.com/project-serum/serum-dex", rev = "85b4f14", version = "0.5.6", features = ["no-entrypoint"] }