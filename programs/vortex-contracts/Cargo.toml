[package]
name = "vortex-contracts"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vortex_contracts"
path="src/lib.rs"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = ["devnet"]
devnet=[]

[dependencies]
anchor-lang = "0.29.0"
solana-program = "1.18.22"
anchor-spl = "0.29.0"
pyth-client = "0.2.2"
bytemuck = { version = "1.4.0" }
borsh = "0.10.3"
num-traits = "0.2.19"
uint = "0.9.5"
num-derive = "0.4.2"
thiserror = "1.0.61"
num-integer = "0.1.44"
arrayref = "0.3.6"
base64 = "0.13.1"
enumflags2 = "0.7.10"
pyth-solana-receiver-sdk = "0.3.0"
serum_dex = "0.5.4"


[dev-dependencies]
pyth = { path = "../pyth", features = ["no-entrypoint"]}