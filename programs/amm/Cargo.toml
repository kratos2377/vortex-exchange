[package]
name = "amm"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "amm"

[features]
no-entrypoint = ["serum_dex/no-entrypoint"]
program = ["serum_dex/program", "serum_dex/no-entrypoint"]
default = ["program"]
client = ["serum_dex/client"]
devnet = []
testnet = []


[dependencies]
solana-program = "1.17.6"
spl-token = { version = "4.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "2.3.0", features = [
    "no-entrypoint",
] }
serum_dex = { version = "0.5.10", git = "https://github.com/raydium-io/openbook-dex", features = [
    "no-entrypoint",
    "program",
] }
solana-security-txt = "1.1.1"
serde_json = { version = "1.0.56" }
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "1.3.3" }
base64 = "0.13.0"
arrayref = "0.3.6"
arrform = { git = "https://github.com/raydium-io/arrform" }
num-derive = "0.3"
num-traits = "0.2.12"
bytemuck = { version = "1.4.0" }
safe-transmute = "0.11.0"
thiserror = "1.0.20"
uint = "0.9.5"

[dev-dependencies]
bumpalo = { version = "3.4.0", features = ["collections"] }